# Kagi Shinobi Test Separate

## Action

Place tests in `test/`, mirroring src structure. Anything importing `cloudflare:*`
must go under `test/workers/` instead

## Evidence

- Corrected by hand: the directory is `test/`, not `tests/` or `__tests__/`
- Two vitest projects: `unit` (Node) and `workers` (workerd via Miniflare).
  `vitest.config.ts` includes `test/**/*.test.ts` for unit but excludes
  `test/workers/**`, which the workers project owns.
- The Node ESM loader cannot resolve `cloudflare:workers` at all, so a test that
  reaches it transitively fails to import unless it lives in `test/workers/`
- Tests live in dedicated test folders

