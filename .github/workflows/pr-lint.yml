name: pr-lint

# Org convention for every change that lands on main (TogetherWeOwn GitHub standard):
#   * PR title = Conventional Commits header: `type(scope): summary`, <= 100 chars, no trailing period.
#     Types: feat fix perf refactor test docs build ci chore revert style security.
#     Put issue links in the body (`Fixes #123`), not in the title.
#   * PR body follows .github/pull_request_template.md (Thinking Path, Linked Issues or Issue
#     Description, What Changed, Verification, Risks, Model Used). The checks live in
#     .github/scripts/pr_standards.py with their tests next to it; this job runs both.
#   * This repo is public: link GitHub issues (`Fixes #123`) in the body. Internal
#     ticket references are refused by the check.
#   * Repos are squash-merge only and the squash commit title is the PR title, so the history on
#     main is one conventional commit per PR. The push run flags any commit that bypasses it
#     (for example a merge call that passes its own commit_title).
#   * Dependabot PRs and release-please PRs are exempt from the body checks.
#
# Always runs on PRs (CI standard). Deliberately no `paths:` filter: this workflow
# produces a required check, and a workflow-level filter would leave the check unreported
# instead of green.
#
# The job is still called `title`: the main ruleset requires the status context `title`
# (ci-ok + title + gitleaks), so renaming the job would leave that check unreported and block
# every PR. Rename the job only together with a ruleset change.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # Release PRs are opened with GITHUB_TOKEN, which starts no workflows. Their
  # required `title` context is therefore dispatched with the PR number and the
  # exact head: a dispatch event carries no pull_request payload, so the job
  # reads the live PR metadata through ci/pr-lint.ts instead of an empty title
  # and body. See docs/releases.md.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to lint
        required: true
        type: string
      head_sha:
        description: Exact 40-hex head SHA the dispatched checkout must match
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pr-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  REQUIRE_CARD_REF: "false"
  # "warn" while open PRs migrate to the template, then "error". Title format and an empty body
  # are errors in both modes. Card references are not required on this public repo.
  PR_STANDARDS_MODE: "warn"

jobs:
  title:
    # Runner routing: repo vars CI_OVERFLOW_RUNNER (JSON runs-on,
    # e.g. ["ubuntu-latest"]), CI_OVERFLOW_JOBS (JSON job ids) and
    # CI_OVERFLOW_EVENTS (JSON event names) all select the job. Flip back
    # without a PR by deleting CI_OVERFLOW_RUNNER. Sparse checkout + python only.
    #
    # A dispatch runs on the standard free public runner before any legacy
    # routing: the release writer's explicit dispatch must not depend on the
    # overflow vars, and a truthy value there cannot fall back to self-hosted.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON((contains(fromJSON(vars.CI_OVERFLOW_JOBS || '[]'), 'title') && contains(fromJSON(vars.CI_OVERFLOW_EVENTS || '[]'), github.event_name) && vars.CI_OVERFLOW_RUNNER) || '["self-hosted","two-selfhosted"]') }}
    timeout-minutes: 5
    steps:
      # The dispatch helper lives in ci/, so the sparse tree carries it too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            ci
          sparse-checkout-cone-mode: true

      - name: Unit-test the lint
        run: python3 -m unittest discover -s .github/scripts -p 'test_pr_standards.py'

      - name: Check title, body and commits
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: python3 .github/scripts/pr_standards.py

      # Dispatch path: the payload above is empty for a dispatched run, so the
      # real PR metadata is fetched and bound to this exact head first.
      - name: Check dispatched PR title and body
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: node ci/pr-lint.ts
