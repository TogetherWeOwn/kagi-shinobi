name: secret-scan

# Always runs (CI standard TOG-14877). Deliberately no `paths:` filter:
# this workflow produces a required check, and a workflow-level filter
# would leave the check unreported instead of green.
on:
  push:
    branches: [main, "v1-**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  gitleaks:
    # Private repo: GitHub-hosted minutes are billed, so CI runs on the org's
    # self-hosted runners instead.
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
