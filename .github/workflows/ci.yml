name: CI

on:
  push:
    branches: [main, "v1-**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # wrangler requires >= 22; the `wrangler types` step below fails
          # outright on 20, before typecheck or tests ever run.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Regenerate the ambient Cloudflare.Env types from wrangler.jsonc.
      # No auth needed — pure type generation.
      #
      # Deliberately the npm script rather than `npx wrangler types` directly:
      # the flags (--strict-vars=false, see src/env.ts) then live in exactly one
      # place. worker-configuration.d.ts is gitignored, so this step is what CI
      # type checks against, and a flag that drifts between here and
      # package.json fails CI on source that is fine locally.
      - run: npm run cf-typegen
      - run: npm run typecheck
      # test:coverage, not test — same suite, but it is the only entry point
      # that enforces the thresholds in vitest.config.ts. Under plain `npm
      # test` the ratchet never runs and coverage can slide back unnoticed.
      - run: npm run test:coverage
      # dry-run catches broken bindings/migrations without deploying.
      - run: npx wrangler deploy --dry-run
