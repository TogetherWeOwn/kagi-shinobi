name: CI

on:
  push:
    branches: [main, "v1-**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Private repo, so ubuntu-latest spends paid Actions minutes. The fleet's
    # self-hosted/GARM runners (same label as the private Next repos) cost
    # nothing. No job container: this pipeline is node + workerd only — no
    # services, no browsers (Playwright uses its `request` fixture only, and
    # CI never downloads browser binaries).
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # wrangler requires >= 22; the `wrangler types` step below fails
          # outright on 20, before typecheck or tests ever run.
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Regenerate the ambient Cloudflare.Env types from wrangler.jsonc.
      # No auth needed — pure type generation.
      #
      # Deliberately the npm script rather than `npx wrangler types` directly:
      # the flags (--strict-vars=false, see src/env.ts) then live in exactly one
      # place. worker-configuration.d.ts is gitignored, so this step is what CI
      # type checks against, and a flag that drifts between here and
      # package.json fails CI on source that is fine locally.
      - run: npm run cf-typegen
      - run: npm run typecheck
      # test:coverage, not test — same suite, but it is the only entry point
      # that enforces the thresholds in vitest.config.ts. Under plain `npm
      # test` the ratchet never runs and coverage can slide back unnoticed.
      - run: npm run test:coverage
      # dry-run catches broken bindings/migrations without deploying.
      - run: npx wrangler deploy --dry-run
      # End-to-end: boots a real `wrangler dev` and talks to it over HTTP, so
      # it catches what the steps above cannot — a wrangler.jsonc that bundles
      # but does not boot. Needs no Cloudflare credential (every binding
      # resolves locally) and downloads no browsers: the specs use Playwright's
      # request fixture only, never a browser context.
      #
      # Deliberately *after* the dry-run rather than before. Both fail on a
      # broken wrangler.jsonc, but dry-run fails in seconds naming the offending
      # binding or migration, while this step would sit until Playwright's 120s
      # webServer timeout and then report only that the server never came up.
      # Cheapest and most specific diagnostic first.
      - run: npm run test:e2e
