name: CalVer release

# Keep this workflow path so the release-writer cutover has one owner. An
# ordinary merge can propose a version PR, never directly select a release.
# GITHUB_TOKEN-created PRs/releases do not trigger ordinary downstream workflows:
# ci/calver.ts explicitly dispatches full CI and the existing guarded Deploy.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Covers planning, generated-branch updates and publication, including retries.
# Pending runs may coalesce; this is serialization, not a FIFO queue.
concurrency:
  group: calver-version-writer
  cancel-in-progress: false

jobs:
  calver:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # workflow_run is not an overflow-routed event. All new work uses the
    # standard free public runner, with no self-hosted or paid fallback.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      # Trusted main orchestration ONLY, never workflow_run's source artifact or
      # PR code. The selected SHA is read as metadata through the GitHub API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TogetherWeOwn/.github
          ref: 1508f2c10cb83bc0677e8e559ff796a55c66e737
          path: .calver-tooling
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Propose or publish the selected CalVer version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CALVER_TOOLING_ROOT: .calver-tooling/actions/calver
        run: node ci/calver.ts
