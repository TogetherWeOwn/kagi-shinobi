# Highest matching tier wins: sensitive > ordinary > low. Unmatched paths are
# sensitive. This map records review policy; it does not enforce routing.
# QA reviews every PR and verifies both paths and content. Security reviews
# sensitive, unclassified, content-triggered, or QA-escalated changes before QA.
# A sensitive-floor downgrade requires explicit Security approval on the PR.
#
# Content always escalates to sensitive, regardless of path: new or changed
# public endpoints or input parsing; auth, authorization or sessions; crypto,
# keys, secrets or credentials; permissions, tenant isolation or personal data;
# SQL, schema or migrations; dependencies and lockfiles (including dev deps);
# CI or workflows; executable content in fixtures; weakened assertions, deleted
# tests/snapshots or lower gates. Test allowlists cover additive-only changes,
# never weakened or deleted tests.
version: 1
default_tier: sensitive
tiers:
  low:
    # Static search-result samples; executable content escalates as above.
    - test/fixtures/search/basic-results.html
    - test/fixtures/search/grouped-results.html
    - test/fixtures/search/news-heavy.html
    - test/fixtures/search/zero-results.html
    # Additive unit tests only; content triggers still override these paths.
    - test/mcp/search-format.test.ts
    - test/mcp/search-format-eval.test.ts
  ordinary: []
  sensitive:
    - .github/review-tiers.yml
    - .github/workflows/**
    - .github/CODEOWNERS
    - CODEOWNERS
    - .github/rulesets/**
    - .github/branch-protection/**
    - .github/scripts/**
    - .github/dependabot.yml
    - .claude/**
    - '**/AGENTS.md'
    - '**/CLAUDE.md'
    - '**/skills/**'
    - package.json
    - package-lock.json
    - .npmrc
    - tsconfig.json
    - vitest.config.ts
    - playwright.config.ts
    - wrangler.jsonc
    - ci/**
    - src/**
    - test/ci/**
    - test/e2e/**
    - test/token/**
    - test/workers/**
    - test/util/auth.test.ts
    - docs/adr/**
    - '**/Dockerfile*'
    - '**/Makefile'
